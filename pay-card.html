<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexPilot — Add card</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23FF6B1A'/%3E%3Cpath d='M30 22 L72 22 L52 52 L70 52 L28 82 L42 56 L24 56 Z' fill='white'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#080C14;color:#E8EDF4;font-family:'Geist',-apple-system,Segoe UI,Roboto,sans-serif;
             min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:36px 22px}
        .wrap{max-width:420px;width:100%}
        .brand{display:flex;align-items:center;gap:10px;margin-bottom:28px}
        .brand .mark{width:34px;height:34px;border-radius:9px;background:#FF6B1A;display:flex;align-items:center;justify-content:center}
        .brand .mark svg{width:20px;height:20px}
        .brand b{font-size:19px;font-weight:800}
        h1{font-size:22px;font-weight:800;margin-bottom:8px}
        .sub{font-size:13.5px;color:#A8B4C3;line-height:1.5;margin-bottom:24px}
        label{display:block;font-size:12px;color:#7A8699;font-weight:600;margin-bottom:8px}
        #card{background:#111827;border:1px solid #1A2436;border-radius:12px;padding:15px 14px}
        #card.focus{border-color:#FF6B1A}
        button{width:100%;margin-top:20px;background:#FF6B1A;color:#fff;border:0;border-radius:13px;
               padding:15px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
        button:disabled{opacity:.6;cursor:default}
        #err{color:#FF6B6B;font-size:13px;margin-top:12px;min-height:16px}
        .secure{margin-top:18px;font-size:11.5px;color:#5A6577;text-align:center}
    </style>
</head>
<body>
    <div class="wrap">
        <div class="brand">
            <span class="mark"><svg viewBox="0 0 100 100"><path d="M30 22 L72 22 L52 52 L70 52 L28 82 L42 56 L24 56 Z" fill="white"/></svg></span>
            <b>FlexPilot</b>
        </div>
        <h1>Add your card</h1>
        <p class="sub">Pay as you go: 3.5% per grabbed block, charged once fees reach $20. No monthly fee. Cancel anytime.</p>
        <label>Card details</label>
        <div id="card"></div>
        <button id="submit" disabled>Save card</button>
        <div id="err"></div>
        <div class="secure">Securely processed by Stripe. FlexPilot never sees your card number.</div>
    </div>
    <script>
      (function () {
        var params = new URLSearchParams(location.hash.slice(1));
        var cs = params.get('cs'), pk = params.get('pk');
        var errEl = document.getElementById('err');
        var btn = document.getElementById('submit');
        if (!cs || !pk) { errEl.textContent = 'This page was opened incorrectly. Return to FlexPilot and try again.'; return; }

        var stripe = Stripe(pk);
        var card = stripe.elements().create('card', {
          hidePostalCode: true,
          style: { base: { color: '#E8EDF4', fontFamily: 'Geist, sans-serif', fontSize: '16px',
                           '::placeholder': { color: '#5A6577' } }, invalid: { color: '#FF6B6B' } }
        });
        card.mount('#card');
        card.on('ready', function () { btn.disabled = false; });
        card.on('focus', function () { document.getElementById('card').classList.add('focus'); });
        card.on('blur', function () { document.getElementById('card').classList.remove('focus'); });
        card.on('change', function (e) { errEl.textContent = e.error ? e.error.message : ''; });

        btn.addEventListener('click', function () {
          btn.disabled = true; btn.textContent = 'Saving...'; errEl.textContent = '';
          stripe.confirmCardSetup(cs, { payment_method: { card: card } }).then(function (result) {
            if (result.error) {
              errEl.textContent = result.error.message;
              btn.disabled = false; btn.textContent = 'Save card';
            } else {
              location.href = 'https://flexpilot.app/pay-return?setup=success';
            }
          });
        });
      })();
    </script>
</body>
</html>
